
name = "sub-72-assessment"
main = "index.js"
compatibility_date = "2026-11-25"
workers_dev = true

# --------------------------------------------------
# OBSERVABILITY
# --------------------------------------------------

[observability]
enabled = true
head_sampling_rate = 1.0

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1.0
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1.0

# --------------------------------------------------
# ENVIRONMENT VARIABLES
# --------------------------------------------------

[vars]
SUPABASE_URL = "https://mhplukffgcxiorpfunyy.supabase.co"

ALLOWED_ORIGINS = ""

SUB72_LANE_A_FEE_AMOUNT = "250"
SUB72_LANE_B_FEE_AMOUNT = "160"
SUB72_FEE_CURRENCY = "USD"
SUB72_PAYMENT_URL = ""

COMMS_DISPATCH_URL = "https://noreply.15d.name.ng/dispatch-email"

AUTHORITATIVE_SOURCE_DOMAINS = ""

# --------------------------------------------------
# SERVICE BINDING: AIRFIELDS
# --------------------------------------------------

[[services]]
binding = "AIRFIELDS_WORKER"
service = "airfields"

# --------------------------------------------------
# SERVICE BINDING: COMMS DISPATCH
# --------------------------------------------------

[[services]]
binding = "noreply-wings"
service = "noreply-wings"
